# Mantiene al día las acciones (fijadas por SHA) y las dependencias del servidor MCP.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /servers/database-mcp-server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      mcp-server:
        patterns: ['*']
